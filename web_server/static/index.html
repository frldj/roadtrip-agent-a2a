<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadtrip A2A</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: #f1f5f9;
    }

    /* ── Panneau chat ── */
    #chat-panel {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 2px 0 8px rgba(0,0,0,.08);
      z-index: 10;
    }

    #chat-header {
      padding: 14px 16px;
      background: #1e293b;
      color: white;
      flex-shrink: 0;
    }
    #chat-header h1 { font-size: 15px; font-weight: 600; }
    #model-badge {
      margin-top: 3px;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .assistant .avatar { background: #e0f2fe; color: #0284c7; }
    .user .avatar { background: #dbeafe; color: #2563eb; }
    .system-msg .avatar { background: #fef3c7; color: #d97706; }

    .bubble {
      max-width: 82%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .assistant .bubble {
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .system-msg .bubble {
      background: #fef9c3;
      color: #78350f;
      font-size: 13px;
      border-radius: 8px;
      font-style: italic;
    }

    .typing-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #94a3b8;
      margin: 0 1px;
      animation: bounce .8s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay:.15s; }
    .typing-dots span:nth-child(3) { animation-delay:.3s; }
    @keyframes bounce { 0%,80%,100% { transform:translateY(0) } 40% { transform:translateY(-5px) } }

    #input-bar {
      padding: 12px 14px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: white;
    }
    #user-input {
      flex: 1;
      padding: 9px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 22px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    #user-input:focus { border-color: #2563eb; }
    #user-input:disabled { background: #f8fafc; cursor: not-allowed; }

    #send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: #1d4ed8; transform: scale(1.05); }
    #send-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    #send-btn svg { width: 16px; height: 16px; }

    /* ── Panneau carte ── */
    #map-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map-container {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #map { width: 100%; height: 100%; }

    #map-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #94a3b8;
      font-size: 14px;
      gap: 10px;
      pointer-events: none;
    }
    #map-placeholder svg { width: 48px; height: 48px; opacity: .3; }

    /* ── Fiches ── */
    #cards-panel {
      height: 220px;
      border-top: 1px solid #e2e8f0;
      display: none;
      overflow-x: auto;
      overflow-y: hidden;
      background: #f8fafc;
      padding: 12px 16px;
      gap: 16px;
      flex-shrink: 0;
    }
    #cards-panel.visible { display: flex; }

    .cards-column { min-width: 260px; flex-shrink: 0; }
    .cards-col-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
      max-height: 176px;
      padding-right: 4px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .card-row1 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-tesla   { background: #fee2e2; color: #dc2626; }
    .badge-charge  { background: #fef3c7; color: #d97706; }
    .badge-camping { background: #dcfce7; color: #16a34a; }
    .badge-hotel   { background: #dbeafe; color: #2563eb; }

    .card-name { font-weight: 500; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { color: #64748b; font-size: 12px; margin-top: 2px; }
    .card-links { margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
    .card-link {
      font-size: 12px;
      color: #2563eb;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .card-link:hover { text-decoration: underline; }
    .card-link svg { width: 11px; height: 11px; }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>

<!-- ═══ Panneau Chat ══════════════════════════════════════════════════════════ -->
<div id="chat-panel">
  <div id="chat-header">
    <h1>🗺 Roadtrip A2A</h1>
    <div id="model-badge"><span class="dot"></span><span id="model-name">Connexion…</span></div>
  </div>

  <div id="messages"></div>

  <div id="input-bar">
    <input id="user-input" type="text"
           placeholder="Dites-moi où vous voulez aller…"
           disabled autocomplete="off" />
    <button id="send-btn" disabled title="Envoyer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<!-- ═══ Panneau Carte ═════════════════════════════════════════════════════════ -->
<div id="map-panel">
  <div id="map-container">
    <div id="map"></div>
    <div id="map-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
        <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      La carte s'affichera une fois le trajet planifié
    </div>
  </div>

  <div id="cards-panel">
    <div id="charging-col" class="cards-column" style="display:none">
      <div class="cards-col-title">⚡ Arrêts recharge</div>
      <div id="charging-list" class="cards-list"></div>
    </div>
    <div id="accommodation-col" class="cards-column" style="display:none">
      <div class="cards-col-title">🏠 Hébergements</div>
      <div id="accommodation-list" class="cards-list"></div>
    </div>
  </div>
</div>

<script>
// ── Carte Leaflet ─────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([46.5, 2.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const routeGroup = L.layerGroup().addTo(map);

function clearMap() {
  routeGroup.clearLayers();
}

// ── Icônes personnalisées ─────────────────────────────────────────────────────
function iconDiv(emoji, bg, size = 30) {
  return L.divIcon({
    className: '',
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    html: `<div style="background:${bg};width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${size * 0.45}px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.35)">${emoji}</div>`
  });
}

function labelIcon(text, bg, color = 'white') {
  return L.divIcon({
    className: '',
    iconSize: null,
    iconAnchor: [0, 10],
    html: `<div style="background:${bg};color:${color};font-size:11px;font-weight:700;padding:3px 7px;border-radius:10px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap">${text}</div>`
  });
}

// ── Interpolation le long d'une polyligne ─────────────────────────────────────
// Retourne [lat, lon] au pourcentage `fraction` (0–1) du chemin total.
function pointAlongPolyline(latlons, fraction) {
  if (!latlons || latlons.length < 2) return latlons?.[0] ?? [0, 0];

  // Distances cumulées entre chaque paire de points successifs (degrés ≈ km pour la précision requise)
  let total = 0;
  const segs = [];
  for (let i = 1; i < latlons.length; i++) {
    const dlat = latlons[i][0] - latlons[i-1][0];
    const dlon = latlons[i][1] - latlons[i-1][1];
    const d = Math.sqrt(dlat*dlat + dlon*dlon);
    segs.push(d);
    total += d;
  }

  let target = fraction * total;
  for (let i = 0; i < segs.length; i++) {
    if (target <= segs[i]) {
      const t = segs[i] > 0 ? target / segs[i] : 0;
      const a = latlons[i], b = latlons[i+1];
      return [a[0] + t*(b[0]-a[0]), a[1] + t*(b[1]-a[1])];
    }
    target -= segs[i];
  }
  return latlons[latlons.length - 1];
}

// ── Affichage du plan sur la carte ───────────────────────────────────────────
function displayPlan(plan) {
  clearMap();

  const segments = plan.route?.segments || [];
  const stops    = plan.charging?.fuel_or_charge_stops || [];
  const options  = plan.accommodation?.options || [];

  const bounds = [];

  // Polylines + marqueurs de journée
  segments.forEach((seg, i) => {
    if (!seg.start_lat || !seg.end_lat) return;

    const s = [seg.start_lat, seg.start_lon];
    const e = [seg.end_lat, seg.end_lon];
    bounds.push(s, e);

    // Géométrie routière réelle si disponible, sinon ligne droite de secours
    const latlons = seg.path_hint ? JSON.parse(seg.path_hint) : [s, e];

    const popupContent = `<b>Jour ${seg.day_index}</b><br>${seg.start_location} → ${seg.end_location}<br>${seg.distance_km.toFixed(0)} km · ${(seg.duration_minutes / 60).toFixed(1)} h`;

    // Style Google Maps : trait blanc épais en dessous + trait bleu par-dessus
    L.polyline(latlons, { color: 'white', weight: 9, opacity: 0.85, lineCap: 'round', lineJoin: 'round' })
      .addTo(routeGroup);
    L.polyline(latlons, { color: '#1a73e8', weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' })
      .bindPopup(popupContent)
      .addTo(routeGroup);

    // Marqueur début (uniquement pour la 1ère journée)
    if (i === 0) {
      L.marker(s, { icon: iconDiv('🚀', '#16a34a', 32) })
        .bindPopup(`<b>Départ</b><br>${seg.start_location}`)
        .addTo(routeGroup);
    }

    // Marqueur fin de journée
    const isLast = i === segments.length - 1;
    L.marker(e, { icon: iconDiv(isLast ? '🏁' : `J${seg.day_index}`, isLast ? '#16a34a' : '#1e293b', 30) })
      .bindPopup(`<b>${isLast ? 'Arrivée' : 'Étape J' + seg.day_index}</b><br>${seg.end_location}`)
      .addTo(routeGroup);
  });

  // Arrêts de recharge
  stops.forEach(stop => {
    const seg = segments.find(s => s.day_index === stop.day_index);
    if (!seg?.start_lat || !seg?.end_lat) return;

    const frac = Math.min(0.95, Math.max(0.05, stop.distance_from_day_start_km / (seg.distance_km || 1)));
    const [lat, lon] = seg.path_hint
      ? pointAlongPolyline(JSON.parse(seg.path_hint), frac)
      : [seg.start_lat + frac * (seg.end_lat - seg.start_lat),
         seg.start_lon + frac * (seg.end_lon - seg.start_lon)];

    const isTesla = (stop.station_provider_hint || '').toLowerCase().includes('tesla');
    const mapsQ = encodeURIComponent((isTesla ? 'Tesla Supercharger ' : 'borne de recharge ') + stop.location_hint);
    const mapsUrl = `https://www.google.com/maps/search/${mapsQ}`;

    L.marker([lat, lon], { icon: iconDiv(isTesla ? '⚡' : '🔌', isTesla ? '#dc2626' : '#d97706', 28) })
      .bindPopup(
        `<b>${stop.station_provider_hint || 'Recharge'}</b><br>` +
        `${stop.location_hint}<br>` +
        `${stop.charge_from_percent.toFixed(0)} % → ${stop.charge_to_percent.toFixed(0)} %<br>` +
        `~${stop.estimated_charging_minutes.toFixed(0)} min<br>` +
        `<a href="${mapsUrl}" target="_blank">Voir sur Maps ↗</a>`
      )
      .addTo(routeGroup);
  });

  // Hébergements
  options.forEach(opt => {
    const seg = segments.find(s => s.day_index === opt.day_index);
    if (!seg?.end_lat) return;

    const isCamping = opt.type === 'camping';
    const mapsQ = encodeURIComponent(opt.name + ' ' + opt.location_hint);
    const mapsUrl = `https://www.google.com/maps/search/${mapsQ}`;
    const price = opt.estimated_price_eur
      ? `~${opt.estimated_price_eur} €/nuit`
      : (opt.price_min_eur ? `${opt.price_min_eur}–${opt.price_max_eur} €/nuit` : '');

    L.marker([seg.end_lat, seg.end_lon], {
      icon: labelIcon(isCamping ? '⛺ ' + opt.name.substring(0, 18) : '🏨 ' + opt.name.substring(0, 18),
                      isCamping ? '#16a34a' : '#2563eb')
    })
      .bindPopup(
        `<b>${opt.name}</b><br>` +
        `${opt.location_hint}<br>` +
        (price ? price + '<br>' : '') +
        (opt.rating ? `⭐ ${opt.rating}<br>` : '') +
        `<a href="${mapsUrl}" target="_blank">Voir sur Maps ↗</a>`
      )
      .addTo(routeGroup);
  });

  if (bounds.length) {
    map.fitBounds(bounds, { padding: [30, 30] });
  }

  document.getElementById('map-placeholder').style.display = 'none';

  // Fiches latérales
  buildChargingCards(stops, segments, plan.charging?.vehicle_type);
  buildAccommodationCards(options, segments);

  const cardsPanel = document.getElementById('cards-panel');
  const hasCards = stops.length > 0 || options.length > 0;
  if (hasCards) {
    cardsPanel.classList.add('visible');
    setTimeout(() => map.invalidateSize(), 50);
  }
}

function buildChargingCards(stops, segments, vehicleType) {
  const col = document.getElementById('charging-col');
  const list = document.getElementById('charging-list');
  list.innerHTML = '';
  if (!stops.length) { col.style.display = 'none'; return; }

  col.style.display = 'block';
  stops.forEach(stop => {
    const isTesla = (stop.station_provider_hint || '').toLowerCase().includes('tesla');
    const mapsQ = encodeURIComponent((isTesla ? 'Tesla Supercharger ' : 'borne recharge ') + stop.location_hint);
    const mapsUrl = `https://www.google.com/maps/search/${mapsQ}`;
    const teslaUrl = isTesla
      ? `https://www.tesla.com/findus/list/superchargers/France`
      : null;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row1">
        <span class="badge ${isTesla ? 'badge-tesla' : 'badge-charge'}">${stop.station_provider_hint || 'Recharge'}</span>
        <span style="color:#64748b;font-size:12px">J${stop.day_index}</span>
      </div>
      <div class="card-name">${stop.location_hint}</div>
      <div class="card-meta">${stop.charge_from_percent.toFixed(0)} % → ${stop.charge_to_percent.toFixed(0)} % · ~${stop.estimated_charging_minutes.toFixed(0)} min</div>
      <div class="card-links">
        <a class="card-link" href="${mapsUrl}" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Google Maps
        </a>
        ${isTesla ? `<a class="card-link" href="${teslaUrl}" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Tesla.com
        </a>` : ''}
      </div>`;
    list.appendChild(card);
  });
}

function buildAccommodationCards(options, segments) {
  const col = document.getElementById('accommodation-col');
  const list = document.getElementById('accommodation-list');
  list.innerHTML = '';
  if (!options.length) { col.style.display = 'none'; return; }

  col.style.display = 'block';
  options.forEach(opt => {
    const isCamping = opt.type === 'camping';
    const mapsQ = encodeURIComponent(opt.name + ' ' + opt.location_hint);
    const mapsUrl = `https://www.google.com/maps/search/${mapsQ}`;
    const bookingQ = encodeURIComponent(opt.name);
    const bookingUrl = isCamping
      ? `https://www.campingfrance.com/fr/recherche?query=${encodeURIComponent(opt.location_hint)}`
      : `https://www.booking.com/searchresults.fr.html?ss=${encodeURIComponent(opt.name + ' ' + opt.location_hint)}`;

    const price = opt.estimated_price_eur
      ? `~${opt.estimated_price_eur} €/nuit`
      : (opt.price_min_eur ? `${opt.price_min_eur}–${opt.price_max_eur} €/nuit` : '');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row1">
        <span class="badge ${isCamping ? 'badge-camping' : 'badge-hotel'}">${isCamping ? 'Camping' : 'Hôtel'}</span>
        <span style="color:#64748b;font-size:12px">J${opt.day_index}</span>
        ${opt.rating ? `<span style="color:#d97706;font-size:12px">⭐ ${opt.rating}</span>` : ''}
      </div>
      <div class="card-name">${opt.name}</div>
      <div class="card-meta">${opt.location_hint}${price ? ' · ' + price : ''}</div>
      <div class="card-links">
        <a class="card-link" href="${mapsUrl}" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Maps
        </a>
        <a class="card-link" href="${bookingUrl}" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          ${isCamping ? 'CampingFrance' : 'Booking.com'}
        </a>
      </div>`;
    list.appendChild(card);
  });
}

// ── Messages UI ───────────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMsg(role, content) {
  const avatars = { assistant: '🤖', user: '🧑', 'system-msg': 'ℹ️' };
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${avatars[role] || '•'}</div>
    <div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = content;
  messagesEl.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}

function addProgress(text) {
  const div = document.createElement('div');
  div.className = 'msg system-msg';
  div.innerHTML = `<div class="avatar">⏳</div><div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'msg assistant';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws = null;
let currentBubble = null;
let currentText   = '';
let inputLocked   = true;

function setInput(enabled) {
  inputLocked = !enabled;
  document.getElementById('user-input').disabled = !enabled;
  document.getElementById('send-btn').disabled   = !enabled;
  if (enabled) document.getElementById('user-input').focus();
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);

  ws.onopen = () => {};

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);

    switch (msg.type) {
      case 'ready':
        document.getElementById('model-name').textContent = msg.model;
        addMsg('assistant', 'Bonjour ! Dites-moi où vous souhaitez aller et je planifierai votre roadtrip 🗺');
        setInput(true);
        break;

      case 'token':
        removeTyping();
        if (!currentBubble) {
          currentText  = '';
          currentBubble = addMsg('assistant', '');
        }
        currentText += msg.content;
        currentBubble.textContent = currentText;
        scrollBottom();
        break;

      case 'message_done':
        currentBubble = null;
        currentText   = '';
        break;

      case 'plan_start':
        addProgress('Planification du trajet en cours…');
        break;

      case 'progress':
        addProgress(msg.content);
        break;

      case 'plan':
        displayPlan(msg.data);
        currentBubble = null;
        currentText   = '';
        break;

      case 'error':
        removeTyping();
        currentBubble = null;
        const errDiv = document.createElement('div');
        errDiv.className = 'msg system-msg';
        errDiv.innerHTML = `<div class="avatar">❌</div><div class="bubble">${escHtml(msg.content)}</div>`;
        messagesEl.appendChild(errDiv);
        scrollBottom();
        setInput(true);
        break;

      case 'done':
        removeTyping();
        currentBubble = null;
        currentText   = '';
        setInput(true);
        break;
    }
  };

  ws.onclose = () => {
    document.getElementById('model-name').textContent = 'Déconnecté – reconnexion…';
    setInput(false);
    setTimeout(connect, 2500);
  };

  ws.onerror = () => ws.close();
}

// ── Envoi ─────────────────────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('user-input');
  const text  = input.value.trim();
  if (!text || inputLocked || !ws || ws.readyState !== WebSocket.OPEN) return;

  input.value = '';
  addMsg('user', text);
  setInput(false);

  currentBubble = null;
  currentText   = '';
  showTyping();

  ws.send(JSON.stringify({ type: 'user_message', content: text }));
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

connect();
</script>
